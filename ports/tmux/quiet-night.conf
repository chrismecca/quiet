# @(#)quiet / tmux / ports/tmux/quiet-night.conf / 2026-10-19

# quiet-night
#
# quiet color overlay for tmux.
#
# This file changes tmux interface color only.
# It does not configure content, layout, key bindings, formats,
# plugins, or terminal behavior.

# Status line.
set-option -ag status-style 'bg=#222A2D,fg=#E2E0D7'
set-option -ag status-left-style 'fg=#E2E0D7'
set-option -ag status-right-style 'fg=#9AA29C'

# Messages and command prompts.
set-option -ag message-style 'bg=#242925,fg=#E2E0D7,fill=#242925'
set-option -ag message-command-style 'bg=#242925,fg=#789AA3,fill=#242925'

# Window status.
set-window-option -ag window-status-style 'bg=#222A2D,fg=#9AA29C'
set-window-option -ag window-status-current-style 'bg=#344246,fg=#E2E0D7'
set-window-option -ag window-status-last-style 'bg=#222A2D,fg=#9AA29C'
set-window-option -ag window-status-activity-style 'bg=#222A2D,fg=#789AA3'
set-window-option -ag window-status-bell-style 'bg=#222A2D,fg=#B49A67'

# Pane borders.
set-window-option -ag pane-border-style 'fg=#343B38'
set-window-option -ag pane-active-border-style 'fg=#{?pane_modal_flag,#789AA3,#{?pane_marked,#B49A67,#{?synchronize-panes,#C47D6B,#{?pane_in_mode,#B49A67,#789AA3}}}}'

# Pane and session status, when enabled by the user's configuration.
set-window-option -ag pane-status-style 'fg=#9AA29C'
set-window-option -ag pane-status-current-style 'bg=#344246,fg=#E2E0D7'
set-window-option -ag session-status-style 'fg=#9AA29C'
set-window-option -ag session-status-current-style 'bg=#344246,fg=#E2E0D7'

# Copy and mode UI.
set-window-option -ag mode-style 'bg=#344246,fg=#E2E0D7'
set-window-option -ag copy-mode-match-style 'bg=#262D28,fg=#E2E0D7'
set-window-option -ag copy-mode-current-match-style 'bg=#344246,fg=#E2E0D7'
set-window-option -ag copy-mode-mark-style 'bg=#262D28,fg=#B49A67'
set-window-option -ag copy-mode-line-number-style 'fg=#9AA29C'
set-window-option -ag copy-mode-current-line-number-style 'fg=#789AA3'
set-window-option -ag copy-mode-position-style 'fg=#9AA29C'
set-window-option -ag switch-mode-match-style 'bg=#262D28,fg=#E2E0D7'

# Menus.
set-window-option -ag menu-style 'bg=#242925,fg=#E2E0D7'
set-window-option -ag menu-selected-style 'bg=#344246,fg=#E2E0D7'
set-window-option -ag menu-border-style 'bg=#242925,fg=#343B38'

# Popups.
set-window-option -ag popup-style 'bg=#242925,fg=#E2E0D7'
set-window-option -ag popup-border-style 'bg=#242925,fg=#343B38'

# Tree mode.
set-window-option -ag tree-mode-border-style 'bg=#242925,fg=#343B38'
set-window-option -ag tree-mode-preview-style 'fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#789AA3,#9AA29C}'

# Display-panes overlay and scrollbars.
set-window-option -ag display-panes-border-style 'bg=#222A2D,fg=#343B38'
set-window-option -ag pane-scrollbars-style 'bg=#1C1E1C,fg=#9AA29C'
