# @(#)quiet / tmux / ports/tmux/quiet-day.conf / 2026-10-19

# quiet-day
#
# quiet color overlay for tmux.
#
# This file changes tmux interface color only.
# It does not configure content, layout, key bindings, formats,
# plugins, or terminal behavior.

# Status line.
set-option -ag status-style 'bg=#E4EAED,fg=#1B1F1C'
set-option -ag status-left-style 'fg=#1B1F1C'
set-option -ag status-right-style 'fg=#616B65'

# Messages and command prompts.
set-option -ag message-style 'bg=#E6E9E2,fg=#1B1F1C,fill=#E6E9E2'
set-option -ag message-command-style 'bg=#E6E9E2,fg=#4A6E7A,fill=#E6E9E2'

# Window status.
set-window-option -ag window-status-style 'bg=#E4EAED,fg=#616B65'
set-window-option -ag window-status-current-style 'bg=#D4DDE1,fg=#1B1F1C'
set-window-option -ag window-status-last-style 'bg=#E4EAED,fg=#616B65'
set-window-option -ag window-status-activity-style 'bg=#E4EAED,fg=#4A6E7A'
set-window-option -ag window-status-bell-style 'bg=#E4EAED,fg=#85602E'

# Pane borders.
set-window-option -ag pane-border-style 'fg=#CDD1CA'
set-window-option -ag pane-active-border-style 'fg=#{?pane_modal_flag,#4A6E7A,#{?pane_marked,#85602E,#{?synchronize-panes,#8F5A42,#{?pane_in_mode,#85602E,#4A6E7A}}}}'

# Pane and session status, when enabled by the user's configuration.
set-window-option -ag pane-status-style 'fg=#616B65'
set-window-option -ag pane-status-current-style 'bg=#D4DDE1,fg=#1B1F1C'
set-window-option -ag session-status-style 'fg=#616B65'
set-window-option -ag session-status-current-style 'bg=#D4DDE1,fg=#1B1F1C'

# Copy and mode UI.
set-window-option -ag mode-style 'bg=#D4DDE1,fg=#1B1F1C'
set-window-option -ag copy-mode-match-style 'bg=#E8ECE2,fg=#1B1F1C'
set-window-option -ag copy-mode-current-match-style 'bg=#D4DDE1,fg=#1B1F1C'
set-window-option -ag copy-mode-mark-style 'bg=#E8ECE2,fg=#85602E'
set-window-option -ag copy-mode-line-number-style 'fg=#616B65'
set-window-option -ag copy-mode-current-line-number-style 'fg=#4A6E7A'
set-window-option -ag copy-mode-position-style 'fg=#616B65'
set-window-option -ag switch-mode-match-style 'bg=#E8ECE2,fg=#1B1F1C'

# Menus.
set-window-option -ag menu-style 'bg=#E6E9E2,fg=#1B1F1C'
set-window-option -ag menu-selected-style 'bg=#D4DDE1,fg=#1B1F1C'
set-window-option -ag menu-border-style 'bg=#E6E9E2,fg=#CDD1CA'

# Popups.
set-window-option -ag popup-style 'bg=#E6E9E2,fg=#1B1F1C'
set-window-option -ag popup-border-style 'bg=#E6E9E2,fg=#CDD1CA'

# Tree mode.
set-window-option -ag tree-mode-border-style 'bg=#E6E9E2,fg=#CDD1CA'
set-window-option -ag tree-mode-preview-style 'fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#4A6E7A,#616B65}'

# Display-panes overlay and scrollbars.
set-window-option -ag display-panes-border-style 'bg=#E4EAED,fg=#CDD1CA'
set-window-option -ag pane-scrollbars-style 'bg=#EEEADF,fg=#616B65'
