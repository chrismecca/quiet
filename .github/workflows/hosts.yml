# @(#)quiet / yaml / .github/workflows/hosts.yml / 2026-10-26

# Port tests check each port against its host application where one is
# installed, and skip otherwise. This workflow installs current host releases
# and fails if a test skips, so it also notices when a host drops or renames
# something a port uses.
#
# JetBrains IDEs are too large to install here; their tests run locally.

name: hosts

on:
  pull_request:
    paths:
      - ".github/workflows/hosts.yml"
      - "internal/port/**"
      - "ports/**"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosts:
    name: host applications
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Vim, plutil, and Chrome come with the runner image.
      - name: Install host applications
        run: |
          brew install --quiet bat emacs fzf git-delta helix neovim
          brew install --quiet --cask visual-studio-code

      - name: Host versions
        run: |
          vim --version | head -n 1
          nvim --version | head -n 1
          emacs --version | head -n 1
          hx --version
          bat --version
          delta --version
          fzf --version
          defaults read "/Applications/Visual Studio Code.app/Contents/Info" CFBundleShortVersionString

      - name: Port tests against installed hosts
        shell: bash
        run: |
          status=0
          go test -count=1 -json ./internal/port/... > test.json || status=$?
          jq -rj 'select(.Action == "output") | .Output' test.json
          jq -r 'select(.Action == "skip" and .Test != null
                        and (.Package | endswith("/jetbrains") | not))
                 | "skipped: \(.Package) \(.Test)"' test.json > skipped.txt
          cat skipped.txt
          test ! -s skipped.txt
          exit "$status"
